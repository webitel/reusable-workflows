name: Version

on:
  workflow_call:
    inputs:
      versioning:
        type: string
        required: false
        default: calver
        description: |
          Versioning strategy:
            - calver: version follows the product release branches (vYY.M); the development branch builds the next release line.
            - semver: version follows git tags (vX.Y.Z); any other ref builds on top of the latest tag reachable from HEAD.

      development-branch:
        type: string
        required: false
        default: main
        description: Name of the development branch

      triggered-branch:
        type: string
        required: false
        default: ${{ github.ref_name }}
        description: Name of the triggered branch

      arch:
        type: string
        required: false
        default: amd64
        description: Comma-separated list of target architectures (e.g., "amd64" or "amd64, arm64").

      codename:
        type: string
        required: false
        default: bookworm
        description: Comma-separated list of Debian codenames (e.g., "bookworm" or "bookworm, jammy").

    outputs:
      version:
        value: ${{ jobs.parse.outputs.version }}
        description: Extracted version

      version-build:
        value: ${{ jobs.parse.outputs.version-build }}
        description: Package build number, appended after "-" (e.g., 130)

      prerelease:
        value: ${{ jobs.parse.outputs.prerelease }}
        description: Package version prerelease, appended after "~" (e.g., dev, dev~pr12); empty for releases

      full-version:
        value: ${{ jobs.parse.outputs.full-version }}
        description: Exact package version, including prerelease and build number (e.g., 26.4~dev-130, 1.4.0~dev~pr12-131, 1.4.0-132)

      deb-component:
        value: ${{ jobs.parse.outputs.deb-component }}
        description: Debian repository component to publish into (e.g., dev, 26.4-releases, main)

      repository-environment:
        value: ${{ jobs.parse.outputs.repository-environment }}
        description: GitHub environment used to publish (e.g., acceptance, 26.4-releases, releases)

      release-tag:
        value: ${{ jobs.parse.outputs.release-tag }}
        description: GitHub release tag; empty when the build is not a release (e.g., 26.4-130, v1.4.0)

      build-timestamp:
        value: ${{ jobs.parse.outputs.build-timestamp }}
        description: UTC build timestamp in ISO-8601 format

      commit:
        value: ${{ jobs.parse.outputs.commit }}
        description: Source commit SHA; on pull_request the PR head commit, not the ephemeral merge commit

      branch:
        value: ${{ jobs.parse.outputs.branch }}
        description: Source branch; on pull_request the PR head branch (e.g., main, v26.4, fix/PE-119/build-metadata)

      commit-timestamp:
        value: ${{ jobs.parse.outputs.commit-timestamp }}
        description: UTC committer timestamp of the source commit in ISO-8601 format

      arch-matrix:
        value: ${{ jobs.parse.outputs.arch }}
        description: JSON array of target architectures

      codename-matrix:
        value: ${{ jobs.parse.outputs.codename }}
        description: JSON array of Debian codenames

jobs:
  parse:
    name: Parse
    runs-on: [ arc-runner-set ]
    permissions:
      contents: read
      id-token: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      version-build: ${{ steps.release.outputs.version-build }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      full-version: ${{ steps.release.outputs.full-version }}
      deb-component: ${{ steps.release.outputs.deb-component }}
      repository-environment: ${{ steps.release.outputs.repository-environment }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      build-timestamp: ${{ steps.metadata.outputs.build-timestamp }}
      commit: ${{ steps.source.outputs.commit }}
      branch: ${{ steps.source.outputs.branch }}
      commit-timestamp: ${{ steps.source.outputs.commit-timestamp }}
      arch: ${{ steps.matrix.outputs.arch }}
      codename: ${{ steps.matrix.outputs.codename }}

    steps:
      - name: Generate build metadata
        id: metadata
        shell: bash
        run: echo "build-timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Parse build matrix
        id: matrix
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          CODENAME: ${{ inputs.codename }}

        run: |
          to_json() { echo "$1" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -Rc . | jq -sc .; }
          echo "arch=$(to_json "$ARCH")" >> "$GITHUB_OUTPUT"
          echo "codename=$(to_json "$CODENAME")" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: bash
        env:
          # on pull_request github.sha / github.ref_name point at the ephemeral merge ref
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

        run: |
          # the PR head is a parent of the checked-out merge commit, so the full clone already has it
          commit_timestamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$COMMIT")"

          echo "Source commit: $COMMIT ($commit_timestamp) on $BRANCH"
          {
            echo "commit=$COMMIT"
            echo "branch=$BRANCH"
            echo "commit-timestamp=$commit_timestamp"
          } >> "$GITHUB_OUTPUT"

      - name: For each git ref find the latest release branch
        id: latest-release-branch
        if: inputs.versioning == 'calver'
        uses: webitel/reusable-workflows/actions/check-latest@check-latest-v1.0.2

      - name: Find the latest semver tag reachable from HEAD
        id: latest-tag
        if: inputs.versioning == 'semver'
        shell: bash
        run: |
          latest_tag="$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | head -n 1 || true)"

          echo "Latest semver tag: ${latest_tag:-none}"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        uses: actions/github-script@v9
        env:
          VERSIONING: ${{ inputs.versioning }}
          DEVELOPMENT_BRANCH: ${{ inputs.development-branch }}
          TRIGGERED_BRANCH: ${{ inputs.triggered-branch }}
          LATEST_RELEASE_BRANCH: ${{ steps.latest-release-branch.outputs.version }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}

        with:
          script: |
            const versioning = process.env.VERSIONING;
            const developmentBranch = process.env.DEVELOPMENT_BRANCH;
            const triggeredBranch = process.env.TRIGGERED_BRANCH;
            const latestReleaseBranch = process.env.LATEST_RELEASE_BRANCH;
            const latestTag = process.env.LATEST_TAG;

            console.log(`🧭 Versioning: ${versioning}`);

            function parseSemverTag(tagName) {
              if (!tagName) return null;

              const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tagName);
              if (!match) return null;

              return `${match[1]}.${match[2]}.${match[3]}`;
            }

            function resolveSemver() {
              console.log(`🔀 Triggered ref: ${context.ref}`);
              console.log(`🏷️ Latest tag: ${latestTag || 'none'}`);

              if (context.ref.startsWith('refs/tags/')) {
                const tag = context.ref.slice('refs/tags/'.length);
                const version = parseSemverTag(tag);
                if (!version) {
                  throw new Error(`Unsupported tag "${tag}". Expected release tag in format vX.Y.Z.`);
                }

                console.log('🚀 Processing release build');
                console.log(`📦 Using version from triggered tag: ${tag}`);
                return version;
              }

              console.log('🔨 Processing development build');
              if (!latestTag) {
                console.log('🌱 No release tag found, using 0.0.0');
                return '0.0.0';
              }

              console.log(`📦 Using version of the latest tag: ${latestTag}`);
              return parseSemverTag(latestTag);
            }

            function parseReleaseBranch(branchName) {
              if (!branchName) return null;

              const match = /^v(\d{2})\.(\d{1,2})$/.exec(branchName);
              if (!match) return null;
            
              const year = Number.parseInt(match[1], 10);
              const month = Number.parseInt(match[2], 10);
              if (month < 1 || month > 12) return null;
            
              return {
                branch: branchName,
                year,
                month,
                normalized: `${match[1]}.${month}`
              };
            }
            
            function getCurrentDateVersion() {
              const now = new Date();
              const year = now.getUTCFullYear().toString().slice(-2);
              const month = (now.getUTCMonth() + 1).toString();
              return `${year}.${month}`;
            }

            function getNextDevelopmentVersion(releaseBranch) {
              const release = parseReleaseBranch(releaseBranch);
              if (!release) {
                throw new Error(`Invalid latest release branch: ${releaseBranch}`);
              }

              if (release.month === 12) {
                return `${((release.year + 1) % 100).toString().padStart(2, '0')}.1`;
              }

              return `${release.year.toString().padStart(2, '0')}.${release.month + 1}`;
            }
            
            function resolveCalver() {
              console.log(`📋 Development branch: ${developmentBranch}`);
              console.log(`🔀 Triggered branch: ${triggeredBranch}`);
              console.log(`🏷️ Latest release branch: ${latestReleaseBranch || 'none'}`);

              if (triggeredBranch === developmentBranch) {
                console.log('🔨 Processing development build');

                if (latestReleaseBranch) {
                  const release = parseReleaseBranch(latestReleaseBranch);
                  if (!release) {
                    throw new Error(`Latest release branch "${latestReleaseBranch}" is invalid`);
                  }

                  console.log(`📦 Using next version after latest release branch: ${latestReleaseBranch}`);
                  return getNextDevelopmentVersion(latestReleaseBranch);
                }

                console.log('📅 No release branch found, using date-based version');
                return getCurrentDateVersion();
              }

              const release = parseReleaseBranch(triggeredBranch);
              if (!release) {
                throw new Error(
                  `Unsupported branch "${triggeredBranch}". Expected development branch "${developmentBranch}" ` +
                  'or release branch in format vYY.M / vYY.MM with month in range 1..12.'
                );
              }

              console.log('🚀 Processing release build');
              console.log(`📦 Using version from triggered branch: ${triggeredBranch}`);
              return release.normalized;
            }

            const resolvers = { calver: resolveCalver, semver: resolveSemver };
            if (!Object.hasOwn(resolvers, versioning)) {
              throw new Error(`Unsupported versioning "${versioning}". Expected one of: ${Object.keys(resolvers).join(', ')}.`);
            }

            const version = resolvers[versioning]();

            console.log(`✨ Final version: ${version}`);
            core.setOutput('version', version);

      - name: Derive release metadata
        id: release
        uses: actions/github-script@v9
        env:
          VERSIONING: ${{ inputs.versioning }}
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPMENT_BRANCH: ${{ inputs.development-branch }}
          TRIGGERED_BRANCH: ${{ inputs.triggered-branch }}

        with:
          script: |
            const versioning = process.env.VERSIONING;
            const version = process.env.VERSION;
            const pullRequest = context.payload.pull_request?.number;
            const build = String(context.runNumber);

            // "~" sorts before the release, so apt never prefers a dev build over a release of the same version
            const strategies = {
              calver: {
                isRelease: () => process.env.TRIGGERED_BRANCH !== process.env.DEVELOPMENT_BRANCH,
                release: () => ({ debComponent: `${version}-releases`, repositoryEnvironment: `${version}-releases`, releaseTag: `${version}-${build}` }),
              },
              semver: {
                isRelease: () => context.ref.startsWith('refs/tags/'),
                release: () => ({ debComponent: 'main', repositoryEnvironment: 'releases', releaseTag: `v${version}` }),
              },
            };

            const strategy = strategies[versioning];
            const isRelease = !pullRequest && strategy.isRelease();
            const metadata = isRelease
              ? { prerelease: '', ...strategy.release() }
              : { prerelease: pullRequest ? `dev~pr${pullRequest}` : 'dev', debComponent: 'dev', repositoryEnvironment: 'acceptance', releaseTag: '' };

            const fullVersion = `${version}${metadata.prerelease ? `~${metadata.prerelease}` : ''}-${build}`;

            console.log(`🚀 Release: ${isRelease}`);
            console.log(`✨ Full version: ${fullVersion}`);
            console.log(`📦 Debian component: ${metadata.debComponent}`);
            console.log(`🌍 Repository environment: ${metadata.repositoryEnvironment}`);
            console.log(`🏷️ Release tag: ${metadata.releaseTag || 'none'}`);

            core.setOutput('version-build', build);
            core.setOutput('prerelease', metadata.prerelease);
            core.setOutput('full-version', fullVersion);
            core.setOutput('deb-component', metadata.debComponent);
            core.setOutput('repository-environment', metadata.repositoryEnvironment);
            core.setOutput('release-tag', metadata.releaseTag);

      - name: Report workflow metadata
        if: ${{ steps.version.outputs.version != '' }}
        uses: webitel/reusable-workflows/actions/report-workflow-metadata@report-workflow-metadata-v1
        with:
          sha: ${{ steps.source.outputs.commit }}
          version: ${{ steps.release.outputs.full-version }}
          # semver builds live outside the product release lines, so they share a single "main" line
          release-line: ${{ inputs.versioning == 'semver' && 'main' || steps.version.outputs.version }}
