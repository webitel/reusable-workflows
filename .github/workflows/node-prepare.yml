name: Prepare

on:
  workflow_call:
    inputs:
      versioning:
        type: string
        required: false
        default: calver
        description: |
          Versioning strategy:
            - calver: version follows the product release branches (vYY.M); the development branch builds the next release line.
            - semver: version follows git tags (vX.Y.Z); any other ref builds on top of the latest tag reachable from HEAD.

      development-branch:
        type: string
        required: false
        default: main
        description: Name of the development branch

      triggered-branch:
        type: string
        required: false
        default: ${{ github.ref_name }}
        description: Name of the triggered branch

      only-dependencies:
        type: string
        required: false
        default: false

      arch:
        type: string
        required: false
        default: amd64
        description: Comma-separated list of target architectures (e.g., "amd64" or "amd64, arm64").

      codename:
        type: string
        required: false
        default: bookworm
        description: Comma-separated list of Debian codenames (e.g., "bookworm" or "bookworm, jammy").

    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
        description: Extracted version

      version-build:
        value: ${{ jobs.version.outputs.version-build }}
        description: Package build number, appended after "-" (e.g., 130)

      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}
        description: Package version prerelease, appended after "~" (e.g., dev, dev~pr12); empty for releases

      full-version:
        value: ${{ jobs.version.outputs.full-version }}
        description: Exact package version, including prerelease and build number (e.g., 26.4~dev-130, 1.4.0~dev~pr12-131, 1.4.0-132)

      deb-component:
        value: ${{ jobs.version.outputs.deb-component }}
        description: Debian repository component to publish into (e.g., dev, 26.4-releases, main)

      repository-environment:
        value: ${{ jobs.version.outputs.repository-environment }}
        description: GitHub environment used to publish (e.g., acceptance, 26.4-releases, releases)

      release-tag:
        value: ${{ jobs.version.outputs.release-tag }}
        description: GitHub release tag; empty when the build is not a release (e.g., 26.4-130, v1.4.0)

      build-timestamp:
        value: ${{ jobs.version.outputs.build-timestamp }}
        description: UTC build timestamp in ISO-8601 format

      commit:
        value: ${{ jobs.version.outputs.commit }}
        description: Source commit SHA; on pull_request the PR head commit, not the ephemeral merge commit

      branch:
        value: ${{ jobs.version.outputs.branch }}
        description: Source branch; on pull_request the PR head branch (e.g., main, v26.4, fix/PE-119/build-metadata)

      commit-timestamp:
        value: ${{ jobs.version.outputs.commit-timestamp }}
        description: UTC committer timestamp of the source commit in ISO-8601 format

      arch-matrix:
        value: ${{ jobs.version.outputs.arch-matrix }}
        description: JSON array of target architectures

      codename-matrix:
        value: ${{ jobs.version.outputs.codename-matrix }}
        description: JSON array of Debian codenames

      changes:
        value: ${{ jobs.changes.outputs.changes }}
        description: JSON array of changed categories (e.g., ["node", "dependencies", "workflows"])

jobs:
  version:
    name: Version
    uses: webitel/reusable-workflows/.github/workflows/_version.yml@v2
    if: inputs.only-dependencies != 'true'
    permissions:
      contents: read
      id-token: write

    with:
      versioning: ${{ inputs.versioning }}
      development-branch: ${{ inputs.development-branch }}
      triggered-branch: ${{ inputs.triggered-branch }}
      arch: ${{ inputs.arch }}
      codename: ${{ inputs.codename }}

  changes:
    name: Detect changes
    runs-on: [ arc-runner-set ]
    outputs:
      changes: ${{ steps.build.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            node:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.vue'
              - '**/*.mjs'
              - '**/*.cjs'
            dependencies:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
            workflows:
              - '.github/**'

      - name: Build changes array
        id: build
        env:
          NODE: ${{ steps.filter.outputs.node }}
          DEPENDENCIES: ${{ steps.filter.outputs.dependencies }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}

        run: |
          changes='[]'
          [[ "$NODE" == "true" ]]         && changes=$(echo "$changes" | jq -c '. + ["node"]')
          [[ "$DEPENDENCIES" == "true" ]] && changes=$(echo "$changes" | jq -c '. + ["dependencies"]')
          [[ "$WORKFLOWS" == "true" ]]    && changes=$(echo "$changes" | jq -c '. + ["workflows"]')

          echo "changes=$changes" >> "$GITHUB_OUTPUT"

  dependencies:
    name: Dependencies
    runs-on: [ arc-frontend-runner-set ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Download dependencies
        run: npm ci --install-links --install-strategy shallow
