name: Checks

on:
  workflow_call:
    inputs:
      changes:
        type: string
        required: false
        default: '["node", "dependencies", "workflows"]'
        description: JSON array of changed categories (e.g., ["node", "dependencies", "workflows"])

jobs:
  lint:
    name: Lint code
    if: contains(fromJSON(inputs.changes), 'node') || contains(fromJSON(inputs.changes), 'dependencies')
    runs-on: [ arc-frontend-runner-set ]
    permissions:
      contents: read
      checks: write
      pull-requests: write

    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout shared-actions (for matcher)
        uses: actions/checkout@v7
        with:
          repository: webitel/reusable-workflows
          path: .shared-actions
          ref: v2

      - name: Install dependencies
        run: npm ci --install-links --install-strategy shallow

      - name: Run Biome linter
        run: npm run biome:ci:gh # "gh" coz biome generates specific report format for github

      - name: Run Typecheck
        run: npm run typecheck:ci

  test:
    name: Unit testing
    if: contains(fromJSON(inputs.changes), 'node') || contains(fromJSON(inputs.changes), 'dependencies')
    runs-on: [ arc-frontend-runner-set ]
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --install-links --install-strategy shallow

      - name: Run unit tests
        run: npm run test:unit:ci

  audit:
    name: Vulnerabilities
    if: contains(fromJSON(inputs.changes), 'dependencies')
    runs-on: [ arc-frontend-runner-set ]
    permissions:
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read

    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --install-links --install-strategy shallow

      - name: Run npm audit
        run: |
          set +e
          npm audit --json > audit.json
          status=$?
          set -e

          if [[ $status -ne 0 && ! -s audit.json ]]; then
            echo "npm audit failed to produce a report" >&2
            exit $status
          fi

          if [[ ! -s audit.json ]]; then
            echo '{}' > audit.json
          fi

      - name: Convert npm audit report to SARIF
        id: sarif
        uses: webitel/reusable-workflows/actions/npm-audit-sarif@v2
        with:
          audit-file: audit.json
          sarif-file: report.sarif
          fail-on: high

      - name: Upload to code-scanning
        if: github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif
          category: npm-audit

      - name: Report vulnerabilities and fail
        if: always() && steps.sarif.outputs.has-failures == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const RANK = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };
            const THRESHOLD = 'high';
            const EMOJI = { critical: '🔴', high: '🟠', moderate: '🟡', low: '⚪', info: '⚪' };
            const rank = (s) => RANK[String(s || '').toLowerCase()] ?? 0;
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const blocks = (s) => rank(s) >= rank(THRESHOLD);

            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const entries = Object.entries(report.vulnerabilities || {});
            const blocking = entries.filter(([, v]) => blocks(v.severity));
            const maxSeverity = entries.reduce((m, [, v]) => (rank(v.severity) > rank(m) ? v.severity : m), 'none');

            // Flatten to one row per advisory; transitive-only packages become a single "via <source>" row.
            const rows = [];
            for (const [pkg, v] of entries) {
              const advisories = (v.via || []).filter((x) => typeof x === 'object');
              const chains = (v.via || []).filter((x) => typeof x === 'string');
              if (advisories.length) {
                for (const a of advisories) {
                  rows.push({ pkg, sev: a.severity || 'info', title: a.title || a.name || 'unknown vulnerability', url: a.url || null });
                }
              } else if (chains.length) {
                rows.push({ pkg, sev: v.severity || 'info', title: `via ${chains.join(', ')}`, url: null });
              }
            }
            rows.sort((a, b) => rank(b.sev) - rank(a.sev));

            const label = (s) => `${EMOJI[String(s).toLowerCase()] || ''} ${String(s).toUpperCase()}${blocks(s) ? ' ⛔' : ''}`;
            const cell = (r) => (r.url ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title));

            await core.summary
              .addHeading('🔒 npm audit', 2)
              .addRaw(`Found vulnerabilities in <strong>${entries.length}</strong> package(s); <strong>${blocking.length}</strong> at or above the <code>${THRESHOLD}</code> threshold (highest severity: <strong>${maxSeverity}</strong>). Rows marked ⛔ fail the build.`)
              .addTable([
                [{ data: 'Severity', header: true }, { data: 'Package', header: true }, { data: 'Advisory', header: true }],
                ...rows.map((r) => [label(r.sev), esc(r.pkg), cell(r)]),
              ])
              .write();

            // Plain-text mirror for the step log.
            core.info(`npm audit found vulnerabilities in ${entries.length} package(s); ${blocking.length} at or above ${THRESHOLD} (highest severity: ${maxSeverity}):`);
            for (const r of rows) {
              core.info(`${blocks(r.sev) ? '⛔' : '  '} [${String(r.sev).toUpperCase()}] ${r.pkg}: ${r.title}${r.url ? ` (${r.url})` : ''}`);
            }

            core.setFailed(`npm audit found ${maxSeverity} vulnerabilities: ${blocking.length} of ${entries.length} package(s) at or above ${THRESHOLD}.`);

  codeql-matrix:
    name: CodeQL matrix
    runs-on: [ arc-runner-set ]
    if: github.event.repository.private == false
    outputs:
      languages: ${{ steps.build.outputs.languages }}

    steps:
      - name: Build CodeQL language matrix from changes
        id: build
        env:
          CHANGES: ${{ inputs.changes }}

        run: |
          languages='[]'
          if echo "$CHANGES" | jq -e 'any(. == "node" or . == "dependencies")' > /dev/null 2>&1; then
            languages=$(echo "$languages" | jq -c '. + [{"language": "javascript", "build-mode": "none"}]')
          fi

          if echo "$CHANGES" | jq -e 'any(. == "workflows")' > /dev/null 2>&1; then
            languages=$(echo "$languages" | jq -c '. + [{"language": "actions", "build-mode": "none"}]')
          fi

          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  # Dynamic matrix: only includes languages whose files actually changed.
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    needs: [ codeql-matrix ]
    runs-on: [ arc-frontend-runner-set ]
    if: github.event.repository.private == false && needs.codeql-matrix.outputs.languages != '[]'
    permissions: { checks: write, security-events: write }
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.codeql-matrix.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        if: matrix.language == 'javascript'
        run: npm ci --install-links --install-strategy shallow

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
